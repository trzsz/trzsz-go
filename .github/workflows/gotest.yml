name: Go test trzsz-go
on: [push, pull_request]
jobs:
  go-test-on-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trzsz-go
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: make test
        run: make test GO_TEST='go test -race'
  go-test-on-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout trzsz-go
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: make test
        run: make test GO_TEST='go test -race'
  go-test-on-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout trzsz-go
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: make test
        run: make test GO_TEST='go test -race'
  go-release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trzsz-go
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v1"
          args: release --clean --snapshot --skip=publish
